[project]
name = "whatsapp-access"
version = "0.1.0"
description = "Development tools for the WhatsApp Access NVDA add-on."
requires-python = ">=3.11"
license = "GPL-2.0-or-later"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16", "markdown>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
# The Twinkle Lullaby toolkit, kept exactly as the skill ships it.
extend-exclude = ["tools/sounds/twinkle.py"]

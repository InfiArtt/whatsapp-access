# Publishes a release when a version tag such as v0.2.0 is pushed. The add-on checks this repository's
# latest release once a day and offers it to its users, so a release reaches them without the Add-on Store.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main
        # A release is only published from reviewed code: a tag pushed on another branch fails here.
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install the development tools
        run: |
          pip install -e ".[dev]"

      - name: Check the tag matches both versions
        shell: python
        run: |
          import configparser, os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          manifest = configparser.ConfigParser()
          manifest.read_string("[m]\n" + open("addon/manifest.ini", encoding="utf-8").read())
          addon = manifest["m"]["version"].strip('"')
          if not tag == project == addon:
              sys.exit(f"Tag {tag}, pyproject.toml {project} and addon/manifest.ini {addon} must match.")

      - name: Lint and test
        run: |
          ruff check .
          ruff format --check .
          pytest

      - name: Build the add-on
        run: python build_addon.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: addon
          path: dist/*.nvda-addon

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: addon
          path: dist

      - name: Create the GitHub release with the add-on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release notes are this version's section of CHANGELOG.md; users read them in the add-on's
          # update window before installing.
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found' \
            CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.nvda-addon \
            --title "WhatsApp Access $version" --notes-file notes.md
